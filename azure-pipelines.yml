
trigger:
  - main

pool: asr

stages:

# ============================================================
# STAGE 1 - TERRAFORM INIT
# ============================================================

- stage: Terraform_Init
  displayName: Terraform Init

  jobs:

  - job: terraform_init
    displayName: Terraform Init

    steps:

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'


    # --------------------------------------------------------
    # Download terraform.tfvars
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: tfvars
      displayName: Download Terraform TFVars
      inputs:
        secureFile: 'realinfraterraform.tfvars'


    # --------------------------------------------------------
    # Copy terraform.tfvars
    # --------------------------------------------------------

    - task: Bash@3
      displayName: Copy Terraform TFVars
      inputs:
        targetType: 'inline'
        script: |
          cp "$(tfvars.secureFilePath)" \
             "$(System.DefaultWorkingDirectory)/env/dev/terraform.tfvars"


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        backendServiceArm: 'svc_test'
        backendAzureRmResourceGroupName: 'back-state'
        backendAzureRmStorageAccountName: 'statestorage88888'
        backendAzureRmContainerName: 'statecontainer'
        backendAzureRmKey: 'dev_terraform.tfstate'


# ============================================================
# STAGE 2 - TERRAFORM PLAN
# ============================================================

- stage: Terraform_Plan
  displayName: Terraform Plan

  dependsOn:
    - Terraform_Init

  jobs:

  - job: terraform_plan
    displayName: Terraform Plan

    steps:

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'


    # --------------------------------------------------------
    # Download terraform.tfvars
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: tfvars
      displayName: Download Terraform TFVars
      inputs:
        secureFile: 'realinfraterraform.tfvars'


    # --------------------------------------------------------
    # Copy terraform.tfvars
    # --------------------------------------------------------

    - task: Bash@3
      displayName: Copy Terraform TFVars
      inputs:
        targetType: 'inline'
        script: |
          cp "$(tfvars.secureFilePath)" \
             "$(System.DefaultWorkingDirectory)/env/dev/terraform.tfvars"


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        backendServiceArm: 'svc_test'
        backendAzureRmResourceGroupName: 'back-state'
        backendAzureRmStorageAccountName: 'statestorage88888'
        backendAzureRmContainerName: 'statecontainer'
        backendAzureRmKey: 'dev_terraform.tfstate'


    # --------------------------------------------------------
    # Python - Create TF_VAR_secrets
    # --------------------------------------------------------

    - task: PythonScript@0
      displayName: Create TF_VAR_secrets

      inputs:
        scriptSource: 'inline'
        pythonInterpreter: '/usr/bin/python3'

        script: |
          import os
          import json

          secrets = {
              "vm1": {
                  "username": os.environ["VM1_USERNAME"],
                  "password": os.environ["VM1_PASSWORD"]
              },
              "vm2": {
                  "username": os.environ["VM2_USERNAME"],
                  "password": os.environ["VM2_PASSWORD"]
              }
          }

          tf_var_secrets = json.dumps(secrets)

          print("Creating TF_VAR_secrets...")

          print(
              "##vso[task.setvariable variable=TF_VAR_secrets;issecret=true]"
              + tf_var_secrets
          )

          print("TF_VAR_secrets created successfully")

      env:
        VM1_USERNAME: $(VM1_USERNAME)
        VM1_PASSWORD: $(VM1_PASSWORD)
        VM2_USERNAME: $(VM2_USERNAME)
        VM2_PASSWORD: $(VM2_PASSWORD)


    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: Terraform Plan

      env:
        TF_VAR_secrets: $(TF_VAR_secrets)

      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        environmentServiceNameAzureRM: 'svc_test'


# ============================================================
# STAGE 3 - TERRAFORM APPLY
# ============================================================

- stage: Terraform_Apply
  displayName: Terraform Apply

  dependsOn:
    - Terraform_Plan

  jobs:

  - job: terraform_apply
    displayName: Terraform Apply

    steps:

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'


    # --------------------------------------------------------
    # Download terraform.tfvars
    # --------------------------------------------------------

    - task: DownloadSecureFile@1
      name: tfvars
      displayName: Download Terraform TFVars
      inputs:
        secureFile: 'realinfraterraform.tfvars'


    # --------------------------------------------------------
    # Copy terraform.tfvars
    # --------------------------------------------------------

    - task: Bash@3
      displayName: Copy Terraform TFVars
      inputs:
        targetType: 'inline'
        script: |
          cp "$(tfvars.secureFilePath)" \
             "$(System.DefaultWorkingDirectory)/env/dev/terraform.tfvars"


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        backendServiceArm: 'svc_test'
        backendAzureRmResourceGroupName: 'back-state'
        backendAzureRmStorageAccountName: 'statestorage88888'
        backendAzureRmContainerName: 'statecontainer'
        backendAzureRmKey: 'dev_terraform.tfstate'


    # --------------------------------------------------------
    # Python - Create TF_VAR_secrets
    # --------------------------------------------------------

    - task: PythonScript@0
      displayName: Create TF_VAR_secrets

      inputs:
        scriptSource: 'inline'
        pythonInterpreter: '/usr/bin/python3'

        script: |
          import os
          import json

          secrets = {
              "vm1": {
                  "username": os.environ["VM1_USERNAME"],
                  "password": os.environ["VM1_PASSWORD"]
              },
              "vm2": {
                  "username": os.environ["VM2_USERNAME"],
                  "password": os.environ["VM2_PASSWORD"]
              }
          }

          tf_var_secrets = json.dumps(secrets)

          print("Creating TF_VAR_secrets...")

          print(
              "##vso[task.setvariable variable=TF_VAR_secrets;issecret=true]"
              + tf_var_secrets
          )

          print("TF_VAR_secrets created successfully")

      env:
        VM1_USERNAME: $(VM1_USERNAME)
        VM1_PASSWORD: $(VM1_PASSWORD)
        VM2_USERNAME: $(VM2_USERNAME)
        VM2_PASSWORD: $(VM2_PASSWORD)


    # --------------------------------------------------------
    # Terraform Apply
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: Terraform Apply

      env:
        TF_VAR_secrets: $(TF_VAR_secrets)

      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
        environmentServiceNameAzureRM: 'svc_test'
        commandOptions: '-auto-approve'

